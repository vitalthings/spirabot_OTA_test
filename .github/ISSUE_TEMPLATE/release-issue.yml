name: Release Issue Report
description: Report an issue with a specific firmware release
title: "[Release Issue] "
labels: ["release-issue"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with a firmware release. Please provide as much detail as possible.
        
        **Note:** This repository is for release distribution only. For development issues, please contact the development team through appropriate channels.
  
  - type: input
    id: version
    attributes:
      label: Release Version
      description: Which release version are you using?
      placeholder: "e.g., v1.0.0"
    validations:
      required: true
  
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of issue are you experiencing?
      options:
        - Download/Access Issue
        - Checksum Verification Failed
        - Installation Problem
        - Release Documentation Issue
        - Other
    validations:
      required: true
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe the issue you're experiencing
      placeholder: Provide a clear and concise description of the issue
    validations:
      required: true
  
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: If applicable, provide steps to reproduce the issue
      placeholder: |
        1. Downloaded release from...
        2. Attempted to...
        3. Encountered error...
    validations:
      required: false
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or information about the issue
    validations:
      required: false
